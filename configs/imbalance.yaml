# Imbalance mitigation methods.

methods:
  none:
    description: Baseline multilabel BCE / binary CE
  bce_pos_weight:
    description: "BCEWithLogitsLoss + pos_weight[c] = neg_c / pos_c"
  bce_weight:
    description: "BCEWithLogitsLoss scaled by w[c] = N / (|E| * pos_c)"
  focal:
    description: "Sigmoid Focal Loss with alpha[c] = neg_c / (pos_c + neg_c)"
    gamma: 2.0
  adaptive_focal:
    description: "Adaptive Focal Loss (Labd et al., 2025) with frequency-based gamma"
  undersample:
    description: "Cap per-emotion positives at cutoff (bins of 50)"
    cutoff_bins: [50, 100, 150, 200, 250, 300, 350]
  mlsmote:
    description: "MLSMOTE-style oversampling in MiniLM embedding space"
    embedder: sentence-transformers/all-MiniLM-L6-v2
  genai_aug:
    description: "Inject synthetic positives (bins of 50 up to majority parity)"
    inject_bins: [50, 100, 150, 200, 250, 300, 350]
