# Default experiment settings.

project:
  seed: 42
  output_dir: outputs
  models_dir: models

data:
  ground_truth: Datasets/GroundTruth.csv
  synthetic_dir: Datasets
  guidelines: Datasets/guidelines/Annotation Guidelines.txt
  text_column: sentence
  review_column: review
  emotions:
    - Joy
    - Trust
    - Fear
    - Surprise
    - Sadness
    - Disgust
    - Anger
    - Anticipation
    - Neutral
  generation_emotions:
    - Joy
    - Trust
    - Fear
    - Surprise
    - Sadness
    - Disgust
    - Anger
    - Anticipation
    - Neutral

evaluation:
  n_folds: 10
  max_labels: 3
  metrics:
    - precision
    - recall
    - f1
  averages:
    - micro
    - macro
    - weighted
  subset_accuracy: true
  primary_metric: macro_f1

training:
  encoder: bert-base-cased
  head: multilabel
  epochs: 3
  learning_rate: 2.0e-5
  train_batch_size: 8
  eval_batch_size: 16
  max_length: 512
  weight_decay: 0.01
  warmup_ratio: 0.1
  adam_epsilon: 1.0e-6
  gradient_accumulation_steps: 1
  fp16: false
  early_stopping_patience: 2

# Per-encoder learning-rate search (`emotion-cls tune-encoder`), motivated by
# DeBERTa-v3 needing a non-default LR just to avoid a training collapse: if
# one architecture needed that, others may be quietly under-tuned at the
# shared default too. holdout_n_splits/holdout_seed fix a ~14% stratified
# slice (via data.dataset.tuning_holdout_mask) that tune-encoder scores
# candidates against and that the real 10-fold CV then excludes -- so a
# learning rate can never be picked based on the same rows it's later
# evaluated on.
tuning:
  enabled: true
  holdout_n_splits: 7
  holdout_seed: 43
  # Extended from an initial [1e-6..3e-5] grid after 4/9 encoders' best score
  # was still rising at the 3e-5 edge (bert-base-cased, bert-large-cased,
  # distilbert-base-cased, roberta-base) -- the boundary was clipping their
  # true optimum, not finding it.
  learning_rate_grid: [1.0e-6, 5.0e-6, 1.0e-5, 2.0e-5, 3.0e-5, 5.0e-5, 7.0e-5]

imbalance:
  method: none
  reduction: mean
  focal_gamma: 2.0
  undersample_cutoff: null
  aug_inject_n: null
  synthetic_ml_path: null

decoding:
  temperature: 0.0
  # Candidate temperatures for RQ2 sensitivity / tuning sweeps
  temperature_grid: [0.0, 0.3, 0.7]
  strategy: zero_shot
  few_shot_k: 5
  # Sentences classified per LLM call (the guidelines block -- the expensive
  # part of the prompt -- is sent once per batch instead of once per
  # sentence). Each item carries an explicit id; classify.py validates the
  # response is a same-length array covering every id before trusting it.
  batch_size: 10

augmentation:
  embedder: sentence-transformers/all-MiniLM-L6-v2
  sample_n_per_cell: 20
  default_generator: claude
  default_strategy: few_shot_guidelines_dataset
  temperature: 0.8

experiment:
  # If true, re-running the same command skips completed folds / sentences / generations
  # and appends to existing logs under the output directory.
  resume: true
  # Flush decoder predictions after every sentence (safest for crashes).
  flush_every: 1
  # Ollama lifecycle (open-source decoders): pull if missing; remove only when requested
  # via --unload-ollama or ollama_remove_after_use: true (avoids re-pulling mid-sweep).
  ollama_pull_if_missing: true
  ollama_remove_after_use: false
