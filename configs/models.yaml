# Model catalogue.

encoders:
  bert-base-cased:
    hub_id: bert-base-cased
    family: BERT
    size: base
    baseline: true
  bert-large-cased:
    hub_id: bert-large-cased
    family: BERT
    size: large
  roberta-base:
    hub_id: roberta-base
    family: RoBERTa
    size: base
  roberta-large:
    hub_id: roberta-large
    family: RoBERTa
    size: large
  distilbert-base-cased:
    hub_id: distilbert-base-cased
    family: DistilBERT
    size: base
  deberta-v3-base:
    hub_id: microsoft/deberta-v3-base
    family: DeBERTa-v3
    size: base
    # At the shared default learning_rate (2e-5) DeBERTa-v3 converges to a
    # trivial majority-class prediction (verified: predicts the same fixed
    # 3 labels for ~100% of validation rows, macro_f1 collapses to ~0.13).
    # 5e-6 -- in line with Microsoft's own DeBERTa fine-tuning recipes,
    # notably lower than typical BERT/RoBERTa LRs -- fixes it (macro_f1
    # ~0.36 on the same fold, real per-instance prediction diversity).
    training_overrides:
      learning_rate: 5.0e-6
  deberta-v3-large:
    hub_id: microsoft/deberta-v3-large
    family: DeBERTa-v3
    size: large
    # 5e-6 (same as deberta-v3-base) still collapsed on 6/10 folds -- larger
    # parameter count appears more prone to the same degenerate-optimum
    # failure. Dropping further to 1e-6.
    training_overrides:
      learning_rate: 1.0e-6
  xlnet-base-cased:
    hub_id: xlnet-base-cased
    family: XLNet
    size: base
  xlnet-large-cased:
    hub_id: xlnet-large-cased
    family: XLNet
    size: large

decoders:
  # Open-source via Ollama (local) — keys match `ollama list` on the experiment host
  deepseek-r1-8b:
    backend: ollama
    model_id: deepseek-r1:8b
    access: open-source
    provider: DeepSeek
  mistral:
    backend: ollama
    model_id: mistral:latest
    access: open-source
    provider: Mistral
  gpt-oss-20b:
    backend: ollama
    model_id: gpt-oss:20b
    access: open-source
    provider: OpenAI
  gemma3-4b:
    backend: ollama
    model_id: gemma3:4b
    access: open-source
    provider: Google
  llama3.1-8b:
    backend: ollama
    model_id: llama3.1:8b
    access: open-source
    provider: Meta
  qwen3-8b:
    backend: ollama
    model_id: qwen3:8b
    access: open-source
    provider: Alibaba

  # Proprietary via official APIs
  gpt-5.3-chat:
    backend: openai
    # gpt-5.3-chat-latest / gpt-5.2-chat-latest lock temperature to their
    # internal default (OpenAI rejects any other value with a 400), which
    # breaks RQ2's temperature-grid sweep. gpt-5.2 is the base (non-chat)
    # model and accepts temperature 0.0/0.3/0.7 normally.
    model_id: gpt-5.2
    access: proprietary
    provider: OpenAI
    api_key_env: OPENAI_API_KEY
  gemini-3-flash:
    backend: gemini
    model_id: gemini-3.5-flash
    access: proprietary
    provider: Google
    api_key_env: GEMINI_API_KEY
  claude-haiku-4-5:
    # Switched from claude-opus-4-6 for cost (~80% cheaper: $1/$5 per M
    # in/out vs Opus's $5/$25). claude-sonnet-5 was considered first and
    # rejected: it rejects `temperature` AND `top_p` outright ("deprecated
    # for this model"), which would make RQ2's temperature grid a no-op for
    # Claude. Haiku 4.5 accepts temperature normally -- verified live.
    # Made before any real RQ2 data was collected under the Opus key, so
    # nothing to reconcile/rerun.
    backend: anthropic
    model_id: claude-haiku-4-5-20251001
    access: proprietary
    provider: Anthropic
    api_key_env: ANTHROPIC_API_KEY
  mistral-large-2512:
    backend: mistral
    model_id: mistral-large-2512
    access: proprietary
    provider: Mistral
    api_key_env: MISTRAL_API_KEY

# Generators for RQ4: aliases for the proprietary flagships (must not collide with open-source decoder keys)
augmentation_generators:
  claude:
    backend: anthropic
    model_id: claude-opus-4-6
    api_key_env: ANTHROPIC_API_KEY
  gemini:
    backend: gemini
    model_id: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
  openai:
    backend: openai
    model_id: gpt-5.2
    api_key_env: OPENAI_API_KEY
  # NOT `mistral` — that key is the open-source Ollama decoder
  mistral-large:
    backend: mistral
    model_id: mistral-large-2512
    api_key_env: MISTRAL_API_KEY
